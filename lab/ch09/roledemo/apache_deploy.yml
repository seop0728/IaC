---
- name: Galaxy 역할로 웹서버 띄우기
  hosts: ansible-node1
  become: true

  vars:
    apache_listen_port: 8080
    apache_vhosts:
      - servername: "galaxy.demo"
        documentroot: "/var/www/galaxy"

  pre_tasks:
    - name: 8080 포트 열어두기
      lineinfile:
        path: /etc/apache2/ports.conf
        line: "Listen 8080"
        state: present

    - name: 문서 루트 디렉터리 만들기
      file:
        path: /var/www/galaxy
        state: directory
        mode: "0755"

    - name: 첫 페이지 올리기
      copy:
        dest: /var/www/galaxy/index.html
        content: |
          <h1>Hello from geerlingguy.apache</h1>
          <p>Galaxy에서 받은 역할이 띄운 웹서버입니다.</p>
        mode: "0644"

  roles:
    - geerlingguy.apache

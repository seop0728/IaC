---
- name: var test
  hosts: webservers
  #gather_facts: false
  vars:
    # 플레이북 레벨 변수
    playbook_scope_var: "플레이북에서 정의된 공통 변수"

  tasks:
    - name: 정의된 변수값 출력 및 확인
      debug:
        msg:
          - "호스트 식별자: {{ inventory_hostname }}"
          - "호스트 변수 (http_port): {{ http_port }}"
          - "호스트 변수 (custom_msg): {{ custom_msg }}"
          - "그룹 변수 (ntp_server): {{ ntp_server }}"
          - "그룹 변수 (app_env): {{ app_env }}"
          - "플레이북 변수: {{ playbook_scope_var }}"
